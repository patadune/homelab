services:
    traefik:
        image: traefik:v3.7.13
        container_name: traefik
        command:
            - "--log.level=INFO"
            - "--api.dashboard=true"
            - "--api.insecure=true"
            - "--providers.docker=true"
            - "--providers.docker.exposedbydefault=false"
            - "--entrypoints.web.address=:80"
            - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
            - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
            - "--entrypoints.websecure.address=:443"
            - "--entrypoints.websecure.http.tls=true"
            - "--entrypoints.websecure.http.tls.certResolver=le"
            - "--entrypoints.websecure.http.tls.domains[0].main=${LAN_DOMAIN}"
            - "--entrypoints.websecure.http.tls.domains[0].sans=*.${LAN_DOMAIN}"
            - "--certificatesResolvers.le.acme.email=${EMAIL}"
            - "--certificatesResolvers.le.acme.storage=/etc/traefik/acme.json"
            - "--certificatesResolvers.le.acme.dnsChallenge.provider=infomaniak"
            - "--certificatesResolvers.le.acme.dnsChallenge.propagation.delayBeforeChecks=10"
        ports:
            - 80:80
            - 443:443
        expose:
            - 8080
        volumes:
            # So that Traefik can listen to the Docker events
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ${BASE_PATH}/traefik:/etc/traefik
        environment:
            - INFOMANIAK_ACCESS_TOKEN
            - LAN_DOMAIN
        labels:
            - diun.enable=true
            - traefik.enable=true
            - traefik.http.routers.traefik.entryPoints=websecure
            - traefik.http.routers.traefik.rule=Host(`traefik.${LAN_DOMAIN}`)
            - traefik.http.services.traefik.loadbalancer.server.port=8080
        restart: unless-stopped

    tvheadend:
        image: lscr.io/linuxserver/tvheadend:latest
        container_name: tvheadend
        environment:
            - PUID
            - PGID
            - TZ
        volumes:
            - ${BASE_PATH}/tvheadend:/config
            - recordings:/recordings
        ports:
            - 9982:9982
        devices:
            - /dev/dvb:/dev/dvb
        labels:
            - traefik.enable=true
            - traefik.http.routers.tv.entryPoints=websecure
            - traefik.http.routers.tv.rule=Host(`tv.${LAN_DOMAIN}`)
            - traefik.http.services.tv.loadbalancer.server.port=9981
        restart: unless-stopped

    adguard:
        image: adguard/adguardhome:v0.107.79
        container_name: adguard
        ports:
            - 53:53/udp
        volumes:
            - ${BASE_PATH}/adguard/work:/opt/adguardhome/work
            - ${BASE_PATH}/adguard/conf:/opt/adguardhome/conf
        labels:
            - diun.enable=true
            - traefik.enable=true
            - traefik.http.routers.adguard.entryPoints=websecure
            - traefik.http.routers.adguard.rule=Host(`adguard.${LAN_DOMAIN}`)
            - traefik.http.services.adguard.loadbalancer.server.port=3000
        restart: unless-stopped

    uptime-kuma:
        image: louislam/uptime-kuma:2.5.5
        container_name: uptime-kuma
        volumes:
            - ${BASE_PATH}/uptime-kuma:/app/data
        labels:
            - diun.enable=true
            - traefik.enable=true
            - traefik.http.routers.uptime-kuma.entryPoints=websecure
            - traefik.http.routers.uptime-kuma.rule=Host(`uptime.${LAN_DOMAIN}`)
        expose:
            - 3001
        restart: unless-stopped

    home-assistant:
        image: homeassistant/home-assistant:2026.9.3
        container_name: home-assistant
        cap_add:
            - NET_ADMIN
            - NET_RAW
        volumes:
            - /run/dbus:/run/dbus:ro
            - ${BASE_PATH}/home-assistant:/config
        environment:
            - TZ
        labels:
            - diun.enable=true
            - traefik.enable=true
            - traefik.http.routers.home-assistant.entryPoints=websecure
            - traefik.http.routers.home-assistant.rule=Host(`ha.${LAN_DOMAIN}`)
        expose:
            - 8123
        restart: unless-stopped

    mosquitto:
        image: eclipse-mosquitto:2.1.2-alpine
        container_name: mosquitto
        volumes:
            - ${BASE_PATH}/mosquitto:/mosquitto/config
            - mosquitto_data:/mosquitto/data
            - mosquitto_log:/mosquitto/log
        labels:
            - diun.enable=true
            - diun.include_tags=^\d+\.\d+\.\d+-alpine$

    zigbee2mqtt:
        image: koenkk/zigbee2mqtt:2.14.1
        container_name: zigbee2mqtt
        depends_on:
            - mosquitto
        volumes:
            - ${BASE_PATH}/zigbee2mqtt:/app/data
            - /run/udev:/run/udev:ro
        environment:
            - TZ
        labels:
            - diun.enable=true
            - traefik.enable=true
            - traefik.http.routers.zigbee2mqtt.entryPoints=websecure
            - traefik.http.routers.zigbee2mqtt.rule=Host(`zigbee.${LAN_DOMAIN}`)
        expose:
            - 8080
        devices:
            - /dev/serial/by-id/${ZIGBEE_ADAPTER_ID}:/dev/ttyUSB0
        restart: unless-stopped

    iSponsorBlockTV:
        image: ghcr.io/dmunozv04/isponsorblocktv:v2.11.0
        container_name: iSponsorBlockTV
        restart: unless-stopped
        volumes:
            - ${BASE_PATH}/isponsorblocktv:/app/data
        labels:
            - diun.enable=true

    diun:
        image: crazymax/diun:4.33.0
        container_name: diun
        command: serve
        volumes:
            - ${BASE_PATH}/diun:/data
            - /var/run/docker.sock:/var/run/docker.sock:ro
        environment:
            - TZ
            - DIUN_NOTIF_PUSHOVER_TOKEN
            - DIUN_NOTIF_PUSHOVER_RECIPIENT
            - DIUN_WATCH_WORKERS=20
            - DIUN_WATCH_SCHEDULE=0 */6 * * *
            - DIUN_WATCH_JITTER=30s
            - DIUN_PROVIDERS_DOCKER=true
            - DIUN_DEFAULTS_WATCHREPO=true
            - DIUN_DEFAULTS_MAXTAGS=3
            - DIUN_DEFAULTS_SORTTAGS=semver
            - DIUN_DEFAULTS_INCLUDETAGS=^v?\d+\.\d+\.\d+$
        labels:
            - diun.enable=true

        restart: unless-stopped

networks:
    default:
        driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  recordings:
    driver_opts:
      type: cifs
      o: "ip=${SAMBA_IP},username=${SAMBA_USER},password=${SAMBA_PASSWORD},uid=${PUID},gid=${PGID},vers=3.0"
      device: "//${SAMBA_IP}/Recordings"
